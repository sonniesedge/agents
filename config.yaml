# config.yaml — repo-wide configuration.
#
# Controls who "owns" the locally-authored skills, where artefacts get
# symlinked, and which remote repos to pull skills from.
#
# Private or work-internal settings belong in config.local.yaml, which is
# gitignored. Same format: its `sources` are appended to the list below, and
# any other key it sets overrides the value here.

# Prefix applied to every skill authored in this repo. Skills are stored
# unprefixed under skills/ and rendered as "<owner>-<skill>" at sync time.
#
# Set `auto` to derive the prefix from this repo's own git remote, so a repo
# published at github.com/sonniesedge/agents yields the prefix "sonniesedge".
# Set a literal string to pin it regardless of remote.
owner: auto

# Which remote `owner: auto` reads. Only used when owner is `auto`.
owner_remote: origin

# Where `./agents.py sync` installs symlinks, grouped by tool. Paths
# may use ~ and $ENV vars.
#
# Recognised kinds within a tool, all optional:
#   skills     directory  <- .build/skills/   (rendered, prefixed)
#   subagents  directory  <- subagents/
#   plugins    directory  <- plugins/
#   rules      directory  <- rules/
#   config     file       <- settings/<tool>/<the target's filename>
#
# Any target may be written longhand to pass options:
#
#   rules:
#     path: ~/.config/opencode/rules
#     merge: true
#
# A bare string is shorthand for `path`. `merge` applies to `rules` only:
# false (the default) links each themed file separately, true concatenates
# them into a single generated AGENTS.md.
#
# Keep rules/ flat: opencode globs basenames only, so a subdirectory would
# load in Claude Code and silently not in opencode. Claude Code reads a rules
# directory natively; opencode must glob it from its config, which sync
# checks for.
targets:
  opencode:
    skills: ~/.config/opencode/skill
    subagents: ~/.config/opencode/agent
    plugins: ~/.config/opencode/plugin
    rules: ~/.config/opencode/rules
    config: ~/.config/opencode/opencode.jsonc

# Remote skill sources. Each is a git repo cloned into .vendor/ and scanned
# for SKILL.md files. Every skill found installs as "<owner>-<skill-name>".
#
# Cloning is always over SSH: shorthand and https:// URLs alike are rewritten
# to git@host:path.git, so private sources work without git stopping to ask
# for a username.
#
# Fields:
#   repo   (required) git URL, or "org/name" shorthand for GitHub
#   owner  (optional) prefix applied to skills from this source.
#          Default: the org the repo belongs to
#   ref    (optional) branch, tag, or commit. Default: the repo's HEAD
#   path   (optional) subdirectory to scan, or a list of them. Default: the
#          repo root. An entry reading "not <path>" excludes instead, and
#          globs are allowed: "not skills/*.archived".
sources:
  - repo: mattpocock/skills
    ref: main
    path: skills

  - repo: vercel-labs/skills
    ref: main
    path: skills/find-skills
