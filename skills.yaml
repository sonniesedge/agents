# skills.yaml — manifest of remote skill sources.
#
# Each source is a git repo that is cloned into vendor/ and scanned for
# SKILL.md files. Every skill found is installed as "<owner>-<skill-name>".
#
# Fields:
#   owner    (required) prefix applied to skills from this source
#   repo     (required) git URL, or "org/name" shorthand for GitHub
#   ref      (optional) branch, tag, or commit. Default: the repo's HEAD
#   path     (optional) subdirectory to scan. Default: repo root
#   include  (optional) list of fnmatch patterns; only matching skills install
#   exclude  (optional) list of fnmatch patterns; matching skills are skipped
#
# Run `./scripts/agents.py sync` to clone/update every source and refresh symlinks.
#
# Private or work-internal sources belong in skills.local.yaml, which is
# gitignored and merged with this file. Same format.

sources:
  - owner: mattpocock
    repo: mattpocock/skills
    ref: main
    path: skills

  - owner: vercel-labs
    repo: vercel-labs/skills
    ref: main
    path: skills
    include:
      - find-skills
